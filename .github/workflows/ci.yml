name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Racket & SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends racket sqlite3 libsqlite3-0 libsqlite3-dev
      - name: Run offline test script
        run: /bin/sh scripts/test-offline.sh
      - name: Run offline demo script with assertions
        run: /bin/sh scripts/demo-offline.sh --assert
      - name: Run offline demo script with json output
        run: /bin/sh scripts/demo-offline.sh --json
